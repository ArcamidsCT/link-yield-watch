name: poll
on:
  schedule: [{cron: '*/10 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: poll
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node poll.mjs
      - run: node rates.mjs || echo "rates refresh failed, keeping old"
      - run: |
          git config user.name "link-yield-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json rates.json
          git diff --cached --quiet || (git commit -m "data: update $(date -u +%FT%TZ)" && git push)
